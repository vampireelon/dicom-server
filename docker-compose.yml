# Phase 11+8 – dicom-server + PostgreSQL (+ optional MOVE dest)
services:
  postgres:
    image: postgres:16-alpine
    container_name: dicom-postgres
    environment:
      POSTGRES_USER: dicom
      POSTGRES_PASSWORD: dicom
      POSTGRES_DB: dicom
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dicom -d dicom"]
      interval: 5s
      timeout: 5s
      retries: 10

  dicom-server:
    build: .
    image: dicom-server:1.3
    container_name: dicom-server
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4242:4242"
      - "8042:8042"
    volumes:
      - ./config/server.docker.json:/etc/dicom-server/server.json:ro
      - dicom-storage:/var/lib/dicom-server/storage
      - dicom-data:/var/lib/dicom-server/data
      - dicom-worklist:/var/lib/dicom-server/worklist
    environment:
      - TZ=UTC
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8042/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  move-dest:
    image: ubuntu:24.04
    container_name: dicom-move-dest
    profiles: ["move"]
    command: >
      bash -c "apt-get update -qq && apt-get install -y -qq dcmtk >/dev/null
      && mkdir -p /data
      && storescp -aet DEST_SCP 11113 -od /data -v"
    ports:
      - "11113:11113"
    volumes:
      - move-dest-data:/data

volumes:
  pg-data:
  dicom-storage:
  dicom-data:
  dicom-worklist:
  move-dest-data:
